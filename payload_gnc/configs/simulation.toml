[controller]
    dt = 3          # s; recorded output spacing
    goal_position = [300.0, 300.0, 0.0]  # m; 

    max_brake = 0.5
    arrival_margin=50.0
    hold_coeff = 0.8
    goal_margin = 50

    stabilisation_time = 10

    [controller.pid_XY]
        kp = 0.3
        ki = 0.000000001
        kd = 0
        ki_max = 1

        error_xy_max = 1 # error_xy_max * np.pi

    [controller.pid_YZ]
        kp = 0.8
        ki = 0.0000
        kd = 0
        ki_max = 0
        error_xy_max = 0.5 # error_xy_max * np.pi

# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––
# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[simulation]
    t_sim = 1000.0                  # s

    init_pos = [0.0, 0.0, -300.0]      # m; NED coordinates
    init_euler = [0.0, 0.0, 0.0]          # deg; NED Euler angles

    rho_air = 1.225                  # kg/m³

# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––
# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[aircraft]
    [aircraft.payload]
        mass = 15.0  # kg; suspended mass, excluding wing
        z_riser = 0.5  # m; riser midpoint to payload center
        S = 0.55  # m²; equivalent sphere's projected area
        CD = 0.8
        kappa_w = 0.0  # m; disabled for your system

    [aircraft.wing]
        default_size = 27

        
        # rho_upper = "TODO"    # kg/m²; upper fabric surface density
        # rho_lower = "TODO"    # kg/m²; lower fabric surface density
        # rho_ribs = "TODO"     # kg/m²; rib fabric surface density
        # N_cells = "TODO"      # integer; used to estimate rib mass








